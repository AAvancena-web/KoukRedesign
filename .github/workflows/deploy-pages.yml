name: Deploy to GitHub Pages

# Publishes the kouk-redesign-project/ static build to GitHub Pages.
# Runs on every push to the default branch.

on:
  push:
    branches: ["claude/kouk-wordpress-redesign-9816gf"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress run.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        # enablement: true turns Pages on via the API if it isn't already,
        # so no manual settings toggle is required.
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Serve the exported homepage build at the site root.
          path: "kouk-redesign-project"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
